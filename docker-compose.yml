services:
  printapi:
    build: .
    image: printapi:latest
    container_name: printapi
    restart: unless-stopped
    environment:
      ApiKeys__MasterKey: ${MASTER_KEY:?Set MASTER_KEY in .env (see .env.example)}
    # The container shares the host's network, so printer discovery (mDNS and the subnet scan) sees the
    # same network as the server instead of Docker's internal one. The API listens directly on port
    # 8080 of the host; `ports:` doesn't apply in this mode. Requires a Linux host.
    network_mode: host
    volumes:
      - printapi-dbs:/app/app_dbs
      - printapi-files:/app/app_files

volumes:
  printapi-dbs:
  printapi-files:
